<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
  </defs>

  <g>
    <rect x="20"  y="80" width="200" height="66" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="120" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1864ab">open a PR</text>
    <text x="120" y="132" text-anchor="middle" font-size="12.5" fill="#868e96">contributor</text>

    <rect x="280" y="80" width="200" height="66" rx="10" fill="#fff0f6" stroke="#e64980" stroke-width="2"/>
    <text x="380" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#a61e4d">review &amp; comment</text>
    <text x="380" y="132" text-anchor="middle" font-size="12.5" fill="#868e96">reviewer</text>

    <rect x="540" y="80" width="200" height="66" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
    <text x="640" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#e67700">revise &amp; reply</text>
    <text x="640" y="132" text-anchor="middle" font-size="12.5" fill="#868e96">contributor</text>

    <rect x="800" y="80" width="200" height="66" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <text x="900" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b8a3e">approve &amp; merge</text>
    <text x="900" y="132" text-anchor="middle" font-size="12.5" fill="#868e96">maintainer</text>
  </g>

  <g stroke="#868e96" stroke-width="2.5" fill="none">
    <line x1="222" y1="113" x2="278" y2="113" marker-end="url(#arrow)"/>
    <line x1="482" y1="113" x2="538" y2="113" marker-end="url(#arrow)"/>
    <line x1="742" y1="113" x2="798" y2="113" marker-end="url(#arrow)"/>
  </g>

  <!-- review loop -->
  <path d="M 640 80 C 640 32, 380 32, 380 78" stroke="#adb5bd" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="510" y="42" text-anchor="middle" font-size="13" fill="#868e96" font-style="italic">as many rounds as it takes</text>
</svg>
