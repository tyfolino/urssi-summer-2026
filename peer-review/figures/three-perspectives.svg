<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
  </defs>

  <!-- central PR -->
  <rect x="250" y="135" width="220" height="84" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="2.5"/>
  <text x="360" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#212529">Pull Request</text>
  <text x="360" y="196" text-anchor="middle" font-size="13" fill="#868e96">the proposed change</text>

  <!-- roles -->
  <rect x="40"  y="25" width="210" height="64" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="145" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="#1864ab">maintainer</text>
  <text x="145" y="73" text-anchor="middle" font-size="12.5" fill="#868e96">keeps the project running</text>

  <rect x="470" y="25" width="210" height="64" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="575" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b8a3e">contributor</text>
  <text x="575" y="73" text-anchor="middle" font-size="12.5" fill="#868e96">submits the change</text>

  <rect x="255" y="285" width="210" height="64" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="360" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#e67700">user</text>
  <text x="360" y="333" text-anchor="middle" font-size="12.5" fill="#868e96">not in the thread, but affected</text>

  <!-- arrows -->
  <g stroke="#868e96" stroke-width="2.5" fill="none">
    <line x1="160" y1="91" x2="270" y2="133" marker-end="url(#arrow)"/>
    <line x1="560" y1="91" x2="450" y2="133" marker-end="url(#arrow)"/>
    <line x1="360" y1="283" x2="360" y2="221" marker-start="url(#arrow)"/>
  </g>
  <text x="185" y="125" text-anchor="middle" font-size="12.5" fill="#495057">reviews</text>
  <text x="535" y="125" text-anchor="middle" font-size="12.5" fill="#495057">submits</text>
  <text x="430" y="258" text-anchor="middle" font-size="12.5" fill="#495057">affected by</text>
</svg>
