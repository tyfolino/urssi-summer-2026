<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- card -->
  <rect x="10" y="10" width="700" height="410" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="2"/>

  <!-- header -->
  <text x="34" y="47" font-size="17" font-weight="bold" fill="#212529">CRE tiling and surface kernel</text>
  <text x="352" y="47" font-size="17" fill="#868e96">#48</text>
  <rect x="396" y="31" width="72" height="25" rx="12" fill="#2f9e44"/>
  <text x="432" y="48" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Open</text>
  <line x1="30" y1="66" x2="690" y2="66" stroke="#e9ecef" stroke-width="2"/>

  <!-- tabs -->
  <text x="34"  y="92" font-size="14" fill="#868e96">Conversation</text>
  <text x="150" y="92" font-size="14" font-weight="bold" fill="#1c7ed6">Files changed</text>
  <line x1="148" y1="100" x2="248" y2="100" stroke="#1c7ed6" stroke-width="2.5"/>

  <!-- diff block -->
  <rect x="30" y="116" width="660" height="96" rx="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1.5"/>
  <text x="46" y="140" font-size="13" fill="#868e96" font-family="monospace">climkern/frontend.py</text>
  <rect x="30" y="150" width="660" height="22" fill="#ffebe9"/>
  <text x="46" y="166" font-size="13" fill="#a61e4d" font-family="monospace">-  def calc_T_feedbacks(ctrl, pert):</text>
  <rect x="30" y="172" width="660" height="22" fill="#e6ffec"/>
  <text x="46" y="188" font-size="13" fill="#2b8a3e" font-family="monospace">+  def calc_T_feedbacks(ctrl, pert, loc="TOA"):</text>

  <!-- inline comment bubble -->
  <rect x="60" y="226" width="600" height="64" rx="8" fill="#eef6ff" stroke="#1c7ed6" stroke-width="1.5"/>
  <circle cx="86" cy="258" r="13" fill="#1c7ed6"/>
  <text x="86" y="263" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">R</text>
  <text x="112" y="252" font-size="14" fill="#212529" font-weight="bold">reviewer</text>
  <text x="112" y="274" font-size="13.5" fill="#343a40">Can you add a test for the new surface (loc="SFC") path?</text>

  <!-- suggestion block -->
  <rect x="60" y="300" width="600" height="58" rx="8" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/>
  <text x="78" y="322" font-size="13" fill="#e67700" font-weight="bold">Suggested change</text>
  <text x="78" y="344" font-size="13" fill="#343a40" font-family="monospace">+  if loc not in ("TOA", "SFC"): raise ValueError(...)</text>

  <!-- approve button -->
  <rect x="500" y="372" width="190" height="36" rx="8" fill="#2f9e44"/>
  <text x="595" y="396" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">✓ Approve</text>
  <text x="34" y="396" font-size="13" fill="#868e96">files changed · inline comment · suggestion →</text>
</svg>
