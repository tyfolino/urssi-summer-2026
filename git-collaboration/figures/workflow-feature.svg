<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
  </defs>

  <text x="380" y="22" text-anchor="middle" font-size="16" font-style="italic" fill="#495057">Same repo, but each feature gets its own branch + PR</text>

  <!-- central repo / main -->
  <rect x="275" y="40" width="210" height="70" rx="10" fill="#fff0f6" stroke="#e64980" stroke-width="2"/>
  <text x="380" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#a61e4d">Central repo</text>
  <text x="380" y="94" text-anchor="middle" font-size="14" fill="#343a40" font-family="monospace">main</text>

  <!-- feature branches -->
  <g>
    <rect x="40"  y="210" width="180" height="58" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <text x="130" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e" font-family="monospace">feature-a</text>
    <rect x="290" y="210" width="180" height="58" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <text x="380" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e" font-family="monospace">feature-b</text>
    <rect x="540" y="210" width="180" height="58" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <text x="630" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e" font-family="monospace">feature-c</text>
  </g>

  <!-- PR arrows from branches up to main -->
  <g stroke="#868e96" stroke-width="2.5" fill="none">
    <line x1="130" y1="208" x2="310" y2="112" marker-end="url(#arrow)"/>
    <line x1="380" y1="208" x2="380" y2="112" marker-end="url(#arrow)"/>
    <line x1="630" y1="208" x2="450" y2="112" marker-end="url(#arrow)"/>
  </g>
  <text x="232" y="165" text-anchor="middle" font-size="13" fill="#1864ab" font-weight="bold">pull request</text>
</svg>
