<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
  </defs>

  <g>
    <rect x="10"  y="75" width="170" height="62" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="95"  y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1864ab">create branch</text>
    <text x="95"  y="120" text-anchor="middle" font-size="12.5" fill="#868e96" font-family="monospace">git switch -c</text>

    <rect x="220" y="75" width="150" height="62" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="295" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1864ab">push it</text>
    <text x="295" y="120" text-anchor="middle" font-size="12.5" fill="#868e96" font-family="monospace">git push</text>

    <rect x="410" y="75" width="160" height="62" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
    <text x="490" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#e67700">open a PR</text>
    <text x="490" y="120" text-anchor="middle" font-size="12.5" fill="#868e96">on GitHub</text>

    <rect x="610" y="75" width="170" height="62" rx="10" fill="#fff0f6" stroke="#e64980" stroke-width="2"/>
    <text x="695" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#a61e4d">review &amp;</text>
    <text x="695" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#a61e4d">discuss</text>

    <rect x="820" y="75" width="160" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <text x="900" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b8a3e">merge 🎉</text>
  </g>

  <g stroke="#868e96" stroke-width="2.5" fill="none">
    <line x1="182" y1="106" x2="218" y2="106" marker-end="url(#arrow)"/>
    <line x1="372" y1="106" x2="408" y2="106" marker-end="url(#arrow)"/>
    <line x1="572" y1="106" x2="608" y2="106" marker-end="url(#arrow)"/>
    <line x1="782" y1="106" x2="818" y2="106" marker-end="url(#arrow)"/>
  </g>

  <!-- revise loop -->
  <path d="M 695 75 C 695 30, 490 30, 490 73" stroke="#adb5bd" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="592" y="40" text-anchor="middle" font-size="12.5" fill="#868e96" font-style="italic">push fixes, re-review</text>
</svg>
