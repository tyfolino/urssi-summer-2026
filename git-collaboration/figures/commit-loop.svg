<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
  </defs>

  <g>
    <rect x="20"  y="70" width="180" height="64" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="110" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#1864ab">✎ edit code</text>
    <text x="110" y="120" text-anchor="middle" font-size="12" fill="#868e96">your normal work</text>

    <rect x="250" y="70" width="180" height="64" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
    <text x="340" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#e67700" font-family="monospace">git add</text>

    <rect x="480" y="70" width="180" height="64" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <text x="570" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b8a3e" font-family="monospace">git commit</text>

    <rect x="710" y="70" width="180" height="64" rx="10" fill="#fff0f6" stroke="#e64980" stroke-width="2"/>
    <text x="800" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#a61e4d" font-family="monospace">git push</text>
  </g>

  <g stroke="#868e96" stroke-width="2.5" fill="none">
    <line x1="202" y1="102" x2="248" y2="102" marker-end="url(#arrow)"/>
    <line x1="432" y1="102" x2="478" y2="102" marker-end="url(#arrow)"/>
    <line x1="662" y1="102" x2="708" y2="102" marker-end="url(#arrow)"/>
  </g>

  <!-- repeat loop -->
  <path d="M 800 70 C 800 20, 110 20, 110 68" stroke="#adb5bd" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="455" y="30" text-anchor="middle" font-size="13" fill="#868e96" font-style="italic">repeat, as often as you like</text>
</svg>
